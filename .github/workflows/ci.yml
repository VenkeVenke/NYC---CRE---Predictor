name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  # ------------------------------------------------------------
  # Job 1: Run Tests
  # Installs dependencies and runs pytest on every push
  # ------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ------------------------------------------------------------
  # Job 2: Build Docker Image
  # Verifies Dockerfile is valid — only runs if tests pass
  # ------------------------------------------------------------
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nyc-cre-predictor:latest .

      - name: Verify image was created
        run: docker image inspect nyc-cre-predictor:latest

  # ------------------------------------------------------------
  # Job 3: Deploy to Render
  # Triggers a redeploy on Render — only runs if Docker build passes
  # and only on pushes to main (not pull requests)
  # ------------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --fail \
            --silent \
            --show-error
